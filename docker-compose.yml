

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Panel web
    environment:
      RABBITMQ_DEFAULT_USER: impochina
      RABBITMQ_DEFAULT_PASS: impochina
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api:
    build:
      context: ./sourcing/api
    depends_on:
      - rabbitmq
    environment:
      PORT: "3301"
      # dentro de la red de Compose, el host de Rabbit es el nombre del servicio
      RABBIT_URL: "amqp://impochina:impochina@rabbitmq:5672"
    ports:
      - "3301:3301"
    # mapea el código (solo lectura) y la "BD" json persistente
    volumes:
      - ./sourcing/api/src:/app/src:ro
      - ./sourcing/api/cart-db.json:/app/cart-db.json
      - impochina-cart-data:/app/data  # <-- AGREGAR ESTA LÍNEA

    restart: unless-stopped

  worker:
    build:
      context: ./sourcing/worker
    depends_on:
      - rabbitmq
      - api
    environment:
      RABBIT_URL: "amqp://impochina:impochina@rabbitmq:5672"
      API_URL: "http://api:3301"   # usa el NOMBRE DEL SERVICIO del API
      USE_PLAYWRIGHT: "1"
      TRANSLATE_ES: "0"            # apágalo mientras no uses traductor real
      USD_RATE: "0.14"             # conversión demo CNY->USD opcional
    restart: unless-stopped

volumes:
  rabbitmq_data:
  impochina-cart-data:
    external: true
